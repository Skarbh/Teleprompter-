<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter - ابقِ عيونك في الكاميرا</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00e5a0;
    --accent2: #00b8d4;
    --text: #e8e8f0;
    --muted: #5a5a7a;
    --speed: 20s;
    --font-size: 52px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== TELEPROMPTER MODE ===== */
  #prompter-mode {
    display: none;
    flex-direction: column;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .cam-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 24px;
    border-radius: 0 0 12px 12px;
    z-index: 100;
    text-transform: uppercase;
  }

  .cam-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #000;
    border-radius: 50%;
    margin-left: 6px;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Gradient fade top/bottom */
  .fade-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 220px;
    background: linear-gradient(to bottom, var(--bg) 40%, transparent);
    z-index: 10;
    pointer-events: none;
  }

  .fade-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background: linear-gradient(to top, var(--bg) 40%, transparent);
    z-index: 10;
    pointer-events: none;
  }

  /* Center focus line */
  .focus-line {
    position: fixed;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
    transform: translateY(-50%);
    opacity: 0.25;
    z-index: 5;
  }

  .scroll-wrapper {
    flex: 1;
    display: flex;
    align-items: flex-start;
    padding: 0 10%;
    overflow: hidden;
  }

  .scroll-track {
    width: 100%;
    animation: scrollUp var(--speed) linear forwards;
    animation-play-state: paused;
    padding-top: 55vh;
    padding-bottom: 55vh;
  }

  .scroll-track.playing {
    animation-play-state: running;
  }

  @keyframes scrollUp {
    from { transform: translateY(0); }
    to { transform: translateY(-100%); }
  }

  .prompt-text {
    font-size: var(--font-size);
    line-height: 1.7;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Controls bar */
  .controls-bar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    background: rgba(18, 18, 26, 0.9);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 20px;
    backdrop-filter: blur(20px);
    z-index: 20;
    transition: opacity 0.3s;
  }

  .controls-bar.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
  }

  .ctrl-btn:hover { color: var(--text); background: var(--border); }
  .ctrl-btn.active { color: var(--accent); }

  .speed-display {
    font-size: 12px;
    color: var(--muted);
    min-width: 60px;
    text-align: center;
    font-weight: 600;
  }

  .divider { width: 1px; height: 24px; background: var(--border); }

  /* ===== SETUP MODE ===== */
  #setup-mode {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
  }

  .setup-header {
    padding: 32px 40px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  .logo-text {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }

  .setup-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 28px 40px 32px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 15px;
    line-height: 1.8;
    padding: 16px;
    resize: none;
    min-height: 300px;
    transition: border-color 0.2s;
    direction: auto;
  }

  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .settings-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .setting-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .slider-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    min-width: 44px;
    text-align: right;
  }

  /* Color themes */
  .theme-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .theme-btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    transition: all 0.2s;
    opacity: 0.6;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
  }

  .theme-btn.selected { opacity: 1; transform: scale(1.05); box-shadow: 0 0 12px currentColor; }

  .start-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    color: #000;
    cursor: pointer;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 32px;
    width: 100%;
    transition: all 0.25s;
    letter-spacing: 0.5px;
    margin-top: auto;
  }

  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,229,160,0.35); }

  .tip-box {
    background: rgba(0,229,160,0.06);
    border: 1px solid rgba(0,229,160,0.2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  .tip-box strong { color: var(--accent); }

  /* Preview */
  .preview-text {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
    text-align: center;
    padding: 20px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    direction: auto;
  }

  @media (max-width: 768px) {
    .setup-body { grid-template-columns: 1fr; }
    .setup-header { padding: 20px 20px 0; }
    .setup-body { padding: 16px 20px 24px; }
  }
</style>
</head>
<body>

<!-- SETUP MODE -->
<div id="setup-mode">
  <div class="setup-header">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">TELEPROMPTER</span>
    </div>
    <div style="font-size:12px; color:var(--muted);">يشتغل في المتصفح • لا يحتاج إنترنت</div>
  </div>

  <div class="setup-body">
    <!-- Text Panel -->
    <div class="panel" style="grid-row: span 1;">
      <div class="panel-title">النص</div>
      <textarea id="script-input" placeholder="اكتب أو الصق نصك هنا...&#10;&#10;يدعم العربي والإنجليزي ✓"></textarea>
      <div class="panel-title" style="margin-top:4px;">معاينة</div>
      <div class="preview-text" id="preview-text">النص يظهر هنا بحجمه الحقيقي</div>
    </div>

    <!-- Settings Panel -->
    <div class="panel">
      <div class="panel-title">الإعدادات</div>

      <div class="settings-grid">

        <div class="setting-row">
          <div class="setting-label">حجم الخط</div>
          <div class="slider-wrap">
            <input type="range" id="font-size" min="28" max="120" value="52">
            <span class="slider-val" id="font-size-val">52px</span>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">سرعة التمرير</div>
          <div class="slider-wrap">
            <input type="range" id="speed" min="5" max="90" value="30">
            <span class="slider-val" id="speed-val">متوسط</span>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">لون النص</div>
          <div class="theme-row">
            <button class="theme-btn selected" data-color="#e8e8f0" style="background:#e8e8f0; color:#000;">أبيض</button>
            <button class="theme-btn" data-color="#00e5a0" style="background:#00e5a0; color:#000;">أخضر</button>
            <button class="theme-btn" data-color="#ffdd57" style="background:#ffdd57; color:#000;">أصفر</button>
            <button class="theme-btn" data-color="#74b9ff" style="background:#74b9ff; color:#000;">أزرق</button>
            <button class="theme-btn" data-color="#fd79a8" style="background:#fd79a8; color:#000;">وردي</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label">خلفية</div>
          <div class="theme-row">
            <button class="theme-btn selected" data-bg="#0a0a0f" style="background:#0a0a0f; color:#fff; border:1px solid #333;">أسود</button>
            <button class="theme-btn" data-bg="#0d1117" style="background:#0d1117; color:#fff; border:1px solid #333;">كحلي</button>
            <button class="theme-btn" data-bg="#1a0a00" style="background:#1a0a00; color:#fff; border:1px solid #333;">بني</button>
            <button class="theme-btn" data-bg="#ffffff" style="background:#fff; color:#000; border:1px solid #ccc;">أبيض</button>
          </div>
        </div>

      </div>

      <div class="tip-box">
        <strong>💡 نصيحة:</strong> ضع شاشتك أو لابتوبك <strong>تحت الكاميرا مباشرة</strong> — كذا عيونك تكون في الكاميرا وانت تقرأ. كبّر الخط لما تبعد عن الشاشة.
      </div>

      <button class="start-btn" onclick="startPrompter()">▶ ابدأ البرزنتيشن</button>
    </div>
  </div>
</div>

<!-- PROMPTER MODE -->
<div id="prompter-mode">
  <div class="cam-indicator">
    <span class="cam-dot"></span> الكاميرا هنا — اطلع فوق
  </div>
  <div class="fade-top"></div>
  <div class="focus-line"></div>
  <div class="scroll-wrapper">
    <div class="scroll-track" id="scroll-track">
      <div class="prompt-text" id="prompt-text"></div>
    </div>
  </div>
  <div class="fade-bottom"></div>

  <!-- Controls -->
  <div class="controls-bar" id="controls-bar">
    <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" title="تشغيل/إيقاف">⏵</button>
    <button class="ctrl-btn" onclick="restart()" title="من البداية">⟳</button>
    <div class="divider"></div>
    <button class="ctrl-btn" onclick="changeSpeed(-5)" title="أبطأ">🐢</button>
    <span class="speed-display" id="live-speed-val">متوسط</span>
    <button class="ctrl-btn" onclick="changeSpeed(5)" title="أسرع">🐇</button>
    <div class="divider"></div>
    <button class="ctrl-btn" onclick="stopPrompter()" title="رجوع">✕</button>
  </div>
</div>

<script>
  let isPlaying = false;
  let currentSpeed = 30;
  let selectedColor = '#e8e8f0';
  let selectedBg = '#0a0a0f';
  let hideControlsTimer;

  // Font size slider
  document.getElementById('font-size').addEventListener('input', function() {
    const v = this.value;
    document.getElementById('font-size-val').textContent = v + 'px';
    document.querySelector('.preview-text').style.fontSize = Math.min(v, 32) + 'px';
    updatePreview();
  });

  // Speed slider
  document.getElementById('speed').addEventListener('input', function() {
    currentSpeed = parseInt(this.value);
    document.getElementById('speed-val').textContent = speedLabel(currentSpeed);
  });

  function speedLabel(v) {
    if (v <= 15) return 'بطيء جداً';
    if (v <= 25) return 'بطيء';
    if (v <= 40) return 'متوسط';
    if (v <= 60) return 'سريع';
    return 'سريع جداً';
  }

  // Text preview
  document.getElementById('script-input').addEventListener('input', updatePreview);
  function updatePreview() {
    const txt = document.getElementById('script-input').value;
    const preview = document.getElementById('preview-text');
    preview.textContent = txt.slice(0, 80) + (txt.length > 80 ? '...' : '') || 'النص يظهر هنا بحجمه الحقيقي';
  }

  // Color themes
  document.querySelectorAll('[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-color]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.color;
    });
  });

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedBg = btn.dataset.bg;
    });
  });

  function startPrompter() {
    const text = document.getElementById('script-input').value.trim();
    if (!text) { alert('اكتب النص أول!'); return; }

    const fontSize = document.getElementById('font-size').value;

    // Apply settings
    document.getElementById('prompt-text').textContent = text;
    document.getElementById('prompt-text').style.fontSize = fontSize + 'px';
    document.getElementById('prompt-text').style.color = selectedColor;

    const bg = selectedBg;
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--surface', bg);

    // Show prompter
    document.getElementById('setup-mode').style.display = 'none';
    document.getElementById('prompter-mode').style.display = 'flex';

    // Set scroll speed
    applySpeed();

    // Auto-start
    setTimeout(() => { isPlaying = false; togglePlay(); }, 500);

    // Hide controls on mouse stillness
    setupHideControls();
  }

  function applySpeed() {
    // Convert speed (5-90) to duration: higher = faster = shorter duration
    const duration = Math.round(200 - currentSpeed * 1.8);
    document.documentElement.style.setProperty('--speed', duration + 's');
    document.getElementById('live-speed-val').textContent = speedLabel(currentSpeed);

    const track = document.getElementById('scroll-track');
    const wasPlaying = isPlaying;
    // Restart animation with new speed
    track.style.animationDuration = duration + 's';
  }

  function togglePlay() {
    const track = document.getElementById('scroll-track');
    const btn = document.getElementById('play-btn');
    isPlaying = !isPlaying;
    if (isPlaying) {
      track.classList.add('playing');
      btn.textContent = '⏸';
      btn.classList.add('active');
    } else {
      track.classList.remove('playing');
      btn.textContent = '⏵';
      btn.classList.remove('active');
    }
  }

  function restart() {
    const track = document.getElementById('scroll-track');
    isPlaying = false;
    track.classList.remove('playing');
    track.style.animation = 'none';
    track.offsetHeight; // reflow
    track.style.animation = '';
    applySpeed();
    setTimeout(() => { togglePlay(); }, 100);
  }

  function changeSpeed(delta) {
    currentSpeed = Math.max(5, Math.min(90, currentSpeed + delta));
    applySpeed();
    // Restart animation to apply new speed
    const track = document.getElementById('scroll-track');
    if (isPlaying) {
      track.style.animationDuration = (Math.round(200 - currentSpeed * 1.8)) + 's';
    }
  }

  function stopPrompter() {
    const track = document.getElementById('scroll-track');
    isPlaying = false;
    track.classList.remove('playing');
    document.getElementById('setup-mode').style.display = 'flex';
    document.getElementById('prompter-mode').style.display = 'none';
    document.documentElement.style.setProperty('--bg', '#0a0a0f');
    document.documentElement.style.setProperty('--surface', '#12121a');
  }

  function setupHideControls() {
    const bar = document.getElementById('controls-bar');
    const show = () => {
      bar.classList.remove('hidden');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => bar.classList.add('hidden'), 3000);
    };
    document.addEventListener('mousemove', show);
    document.addEventListener('touchstart', show);
    document.addEventListener('keydown', (e) => {
      show();
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowUp') changeSpeed(5);
      if (e.code === 'ArrowDown') changeSpeed(-5);
      if (e.code === 'KeyR') restart();
      if (e.code === 'Escape') stopPrompter();
    });
  }
</script>
</body>
</html>
